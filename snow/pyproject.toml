# Makes snow_report installable so the website backend can use it:
#   pip install -e ../snow      (local, from backend/)
#   pip install /snow           (Docker)
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-report"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tzdata",  # time zones for zoneinfo (slim Docker images may not have them)
]

[tool.setuptools.packages.find]
include = ["snow_report*"]
