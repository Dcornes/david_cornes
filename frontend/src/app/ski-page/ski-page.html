<div class="page">
  <header class="topbar">
    <h1>
      <a routerLink="/">David Cornes</a>
      <span class="muted">Skiing</span>
    </h1>
    <app-site-nav />
  </header>

  <nav class="resorts" aria-label="Ski area">
    <a routerLink="/ski" [class.active]="resort() === null" [attr.aria-current]="resort() === null ? 'page' : null">All resorts</a>
    @for (r of resorts; track r.slug) {
      <a [routerLink]="['/ski', r.slug]" [class.active]="resort()?.slug === r.slug" [attr.aria-current]="resort()?.slug === r.slug ? 'page' : null">
        {{ r.name }}
      </a>
    }
  </nav>

  @for (r of current(); track r.slug) {
    <h2 class="resort-name">{{ r.name }}</h2>

    <section class="block" aria-labelledby="today-heading">
      <h2 id="today-heading" class="block-title">{{ resort() ? 'Today' : 'Snow report' }}</h2>
      <app-snow-page [embedded]="true" [resort]="resort()?.slug ?? null" />
    </section>

    @if (r.map) {
      <section class="block">
        <app-heatmap-page
          [embedded]="true"
          [only]="r.name"
          [heatAvailable]="r.heat"
          [bearing]="r.bearing"
          [bestLap]="bestLap()"
        />
      </section>
    }

    @if (r.lifts) {
      <section class="block">
        <app-lifts-page [embedded]="true" [only]="resort()?.name ?? null" (bestLap)="setBestLap($event)" />
      </section>
    } @else {
      <section class="block">
        <p class="muted">No lift data or run map for {{ r.name }} yet; snow and webcams only.</p>
      </section>
    }
  }
</div>
